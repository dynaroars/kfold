# kfold settings for BusyBox 1.38.0. top_dirs is the top-level Makefile's
# core-y (applets/) followed by its libs-y list, in order.
[COMMON]
use_tristate = no
top_dirs = applets archival archival/libarchive console-tools coreutils coreutils/libcoreutils debianutils klibc-utils e2fsprogs editors findutils init libbb libbb/yescrypt libpwdgrp loginutils mailutils miscutils modutils networking networking/libiproute networking/udhcp printutils procps runit selinux shell sysklogd util-linux util-linux/volume_id 
ignore_files = built-in.o
ignore_dirs = scripts
