# kfold settings for Barebox 2026.09.0, sandbox. Derived from the tree:
#   top_dirs          the top-level Kbuild descends into every directory
#                     (obj-y += common/ drivers/ ... arch/$(SRCARCH)/ $(ARCH_CORE))
#   defines           arch/sandbox/Makefile: core-y += $(HOST_DIR)/um/ with
#                     HOST_DIR = arch/$(SUBARCH) (arch/x86/um/ on an x86-64
#                     host), exported by the top-level Makefile as ARCH_CORE
#   composite_objects scripts/Makefile.build links real-obj-y (the members of
#                     built-in composites) into built-in.a without a container
#   family_aliases    scripts/Makefile.build: obj-y += $(obj-pbl-y) and
#                     pbl-y += $(obj-pbl-y)
#   family_suffixes   scripts/Makefile.build: "pbl objects are suffixed with
#                     .pbl.o" (pbl-y := $(patsubst %.o,%.pbl.o,$(pbl-y)))
#   top_dirs (host tools) the top-level Makefile's "scripts: scripts_basic
#                     scripts_dtc ...; $(MAKE) $(build)=$(@)" (archprepare
#                     needs scripts), "prepare0: ...; $(MAKE) $(build)=scripts/mod",
#                     "scripts_dtc: ...; $(MAKE) $(build)=scripts/dtc"
#   entry_goals       "$(objtree)/include/config/auto.conf ...: $(MAKE) -f
#                     $(srctree)/Makefile syncconfig", which "%config:" runs as
#                     "$(MAKE) $(build)=scripts/kconfig ... $@"
#                     (scripts/kconfig/Makefile: "$(simple-targets): $(obj)/conf")
[COMMON]
use_tristate = no
defines = SRCARCH=sandbox ARCH_CORE=arch/x86/um/
target_vars = obj- lib- pbl- obj-pbl- always-
family_aliases = obj-pbl:obj,pbl
family_suffixes = pbl:.pbl.o
composite_objects = modules
entry_files = Kbuild Makefile
top_dirs = . scripts scripts/mod scripts/dtc
entry_goals = scripts/kconfig/syncconfig
ignore_dirs = Documentation
ignore_files = built-in.o
