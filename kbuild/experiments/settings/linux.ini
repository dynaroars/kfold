# kfold settings for Linux 7.2.8, x86. Each entry is derived from the tree:
#   top_dirs      Kbuild (obj-y descent from "."), libs-y := lib/ (Makefile),
#                 and arch/x86/Makefile: archscripts builds arch/x86/tools,
#                 libs-y += arch/x86/lib/, drivers-$(CONFIG_PCI) += arch/x86/pci/,
#                 drivers-$(CONFIG_PM) += arch/x86/power/,
#                 drivers-$(CONFIG_VIDEO) += arch/x86/video/
#   extra_objects objects built by scripts/Makefile.vmlinux{,_o} and
#                 scripts/link-vmlinux.sh outside any Kbuild target list
#                 and scripts/Makefile.modfinal (.module-common.o, for modules)
#                 and scripts/gen-btf.sh (.tmp_vmlinux1.btf.o, for BTF)
#                 (kallsyms passes 0-2 run when CONFIG_KALLSYMS is set; a third
#                 pass runs only when symbol sizes change and is not modeled)
#                 host tools the top-level Makefile builds with $(build)=DIR:
#                 "scripts: ... $(MAKE) $(build)=$(@)" (archprepare needs
#                 scripts), "prepare0: ... $(MAKE) $(build)=scripts/mod",
#                 "scripts_dtc: ... $(MAKE) $(build)=scripts/dtc" (scripts
#                 needs scripts_dtc)
#   entry_goals   arch/x86/Makefile: "all: bzImage"; the top-level Makefile's
#                 "%/config/auto.conf ...: $(KCONFIG_CONFIG)" runs
#                 "$(MAKE) -f $(srctree)/Makefile syncconfig", i.e.
#                 "$(MAKE) $(build)=scripts/kconfig syncconfig" through
#                 "%config:" (scripts/kconfig/Makefile:
#                 "$(simple-targets): $(obj)/conf")
[COMMON]
use_tristate = yes
defines = SRCARCH=x86 BITS=64?CONFIG_X86_64 BITS=32?CONFIG_X86_32
top_dirs = . lib scripts scripts/mod scripts/dtc arch/x86/tools arch/x86/lib arch/x86/pci?CONFIG_PCI arch/x86/power?CONFIG_PM arch/x86/video?CONFIG_VIDEO
composite_objects = modules
extra_objects = vmlinux.o init/version-timestamp.o .tmp_vmlinux0.kallsyms.o?CONFIG_KALLSYMS .tmp_vmlinux1.kallsyms.o?CONFIG_KALLSYMS .tmp_vmlinux2.kallsyms.o?CONFIG_KALLSYMS .vmlinux.export.o .module-common.o?CONFIG_MODULES .tmp_vmlinux1.btf.o?CONFIG_DEBUG_INFO_BTF
need_builtin = yes
target_vars = obj- lib- extra- always-
entry_goals = arch/x86/boot/bzImage scripts/kconfig/syncconfig
