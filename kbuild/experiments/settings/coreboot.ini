# kfold settings for coreboot 26.06, QEMU i440fx. Derived from the tree:
#   entry_files  the top-level Makefile's evaluate_subdirs includes each
#                directory's Makefile.mk (Makefile.inc only as a fallback)
#   top_dirs     Makefile.mk lines 128-149 and 761 (subdirs-y), with the
#                $(wildcard ...) patterns kept as globs and MAINBOARDDIR =
#                emulation/qemu-i440fx
#   target_vars  the classes-y list (Makefile.mk line 153) and the all-,
#                all_x86-, all-stages- aliases
#   root_lists   Makefile.mk "Add paths to files in X-y to X-srcs"; Makefile.mk
#                files also add to X-srcs directly with paths from the tree
#                root, e.g. src/arch/x86/Makefile.mk "ramstage-srcs +=
#                $(wildcard src/mainboard/$(MAINBOARDDIR)/mainboard.c)"
#   defines      MAINBOARDDIR (Makefile.mk: MAINBOARDDIR=$(call
#                strip_quotes,$(CONFIG_MAINBOARD_DIR)))
#   src_dir      Makefile: "src := src"
#   extra_objects objects the top-level Makefile.mk (not analyzed) adds:
#                static.o, sconfig's devicetree code, in every stage
#                (Makefile.mk 782, 803-808: <stage>-y += $(DEVICETREE_STATIC_C)),
#                guarded by the option that builds the stage (romstage: its
#                sources join bootblock without SEPARATE_ROMSTAGE, Makefile.mk
#                1444); and the SIPI vector rmodule, src/cpu/x86/Makefile.mk:
#                "rmodules_$(ARCH-$(TARGET_STAGE)-y)-$(CONFIG_PARALLEL_MP) +=
#                sipi_vector.S" and "$(SIPI_DOTO): ..." (TARGET_STAGE is
#                ramstage with HAVE_RAMSTAGE)
#   rules_from_root the top-level Makefile includes every Makefile.mk into one
#                Make run in the top directory
#   defines      objutil (Makefile: "objutil ?= $(obj)/util", obj := build)
#   entry_goals  host tools the image needs: Makefile.mk "coreboot:
#                $(obj)/coreboot.rom $(obj)/cbfstool $(obj)/rmodtool
#                $(obj)/ifwitool $(obj)/cse_fpt $(obj)/cse_serger" with
#                "$(obj)/X: $(X)" copies (lines 64, 699-721), "$(obj)/coreboot.rom:
#                ... $(CBFSTOOL) $(IFITTOOL)" (1371), "$(obj)/fmap.fmap: ...
#                $(FMAPTOOL)" (1304), "$(DEVICETREE_STATIC_C): ...
#                $(objutil)/sconfig/sconfig" (798), and src/arch/x86/Makefile.mk
#                "$(obj)/cmos_layout.bin: $(NVRAMTOOL)" under HAVE_OPTION_TABLE.
#                Not modeled: cse_fpt/cse_serger's format objects (from
#                "include $(top)/util/cbfstool/bpdt_formats/Makefile.mk";
#                $(top) is left undefined, as defining it changes $(top)/...
#                words in stage lists), util/kconfig (built from a sed-rewritten copy of
#                its Makefile, build/util/kconfig/Makefile.real) and vboot_lib
#                ($(MAKE) -C 3rdparty/vboot)
#   family_guards stages the final image depends on only under an option:
#                verstage  src/security/vboot/Makefile.mk (ifeq
#                          CONFIG_VBOOT_SEPARATE_VERSTAGE, verstage-file)
#                smm       src/cpu/x86/smm/Makefile.mk (ifeq
#                          CONFIG_HAVE_SMI_HANDLER, ramstage-srcs += smm.manual)
#                decompressor Makefile.mk (ifeq CONFIG_COMPRESS_BOOTBLOCK,
#                          bootblock.raw.elf: decompressor.elf)
[COMMON]
use_tristate = no
defines = MAINBOARDDIR=emulation/qemu-i440fx objutil=build/util
rules_from_root = yes
root_lists = srcs
src_dir = src
entry_goals = build/util/cbfstool/cbfstool build/util/cbfstool/ifittool build/util/cbfstool/rmodtool build/util/cbfstool/ifwitool build/util/cbfstool/cse_fpt build/util/cbfstool/cse_serger build/util/cbfstool/fmaptool build/util/sconfig/sconfig build/util/nvramtool/nvramtool?CONFIG_HAVE_OPTION_TABLE
extra_objects = build/bootblock/mainboard/emulation/qemu-i440fx/static.o build/romstage/mainboard/emulation/qemu-i440fx/static.o?CONFIG_SEPARATE_ROMSTAGE build/postcar/mainboard/emulation/qemu-i440fx/static.o?CONFIG_POSTCAR_STAGE build/ramstage/mainboard/emulation/qemu-i440fx/static.o?CONFIG_HAVE_RAMSTAGE build/verstage/mainboard/emulation/qemu-i440fx/static.o?CONFIG_VBOOT_SEPARATE_VERSTAGE build/smm/mainboard/emulation/qemu-i440fx/static.o?CONFIG_HAVE_SMI_HANDLER build/rmodules_x86_32/cpu/x86/sipi_vector.o?CONFIG_PARALLEL_MP&CONFIG_HAVE_RAMSTAGE&CONFIG_ARCH_RAMSTAGE_X86_32 build/rmodules_x86_64/cpu/x86/sipi_vector.o?CONFIG_PARALLEL_MP&CONFIG_HAVE_RAMSTAGE&CONFIG_ARCH_RAMSTAGE_X86_64 build/cpu/x86/sipi_vector.o?CONFIG_PARALLEL_MP&CONFIG_HAVE_RAMSTAGE
target_vars = bootblock- romstage- ramstage- smm- smmstub- verstage- postcar- decompressor- cpu_microcode- all- all_x86- all-stages- subdirs- obj- lib-
family_aliases = all:bootblock,verstage,romstage,postcar,ramstage all_x86:bootblock,romstage,postcar,ramstage
family_guards = verstage:CONFIG_VBOOT_SEPARATE_VERSTAGE smm:CONFIG_HAVE_SMI_HANDLER decompressor:CONFIG_COMPRESS_BOOTBLOCK
entry_files = Makefile.mk Makefile.inc Kbuild Makefile
top_dirs = src/lib src/commonlib src/console src/device src/acpi src/superio/common src/ec/intel?CONFIG_EC_ACPI src/ec/acpi src/ec/*/* src/southbridge/*/* src/soc/* src/soc/*/* src/northbridge/*/* src/superio/* src/superio/*/* src/drivers/* src/drivers/*/* src/drivers/*/*/* src/cpu src/vendorcode util/cbfstool util/sconfig util/nvramtool util/pgtblgen util/amdfwtool util/futility util/marvell util/bincfg util/supermicro util/qemu util/ifdtool src/arch/* src/mainboard/emulation/qemu-i440fx src/security payloads payloads/external src/sbom?CONFIG_SBOM site-local util/checklist util/testing util/nvidia
ignore_dirs =
ignore_files =
