# kfold settings for U-Boot 2026.07, sandbox. top_dirs is the top-level
# Makefile's libs-y list (lines 748 and 1075-1109) plus arch/sandbox/Makefile's
# libs-y (arch/sandbox/cpu/, arch/sandbox/lib/); board/$(BOARDDIR) is
# board/sandbox. extra_objects are arch/sandbox/Makefile's head-y objects.
# composite_objects: scripts/Makefile.build links real-obj-y (members of
# built-in composites) into built-in.a without writing the container.
#   top_dirs (host tools) the top-level Makefile's "u-boot-dirs := ... tools
#                     examples" with "$(u-boot-dirs): prepare; $(MAKE)
#                     $(build)=$@", "scripts: scripts_basic scripts_dtc;
#                     $(MAKE) $(build)=$(@)" (archprepare needs scripts), and
#                     "scripts_dtc: ... $(MAKE) $(build)=scripts/dtc" (DTC is
#                     the in-tree dtc by default)
#   entry_goals       "%/config/auto.conf ...: $(MAKE) -f $(srctree)/Makefile
#                     syncconfig", run by "%config:" as "$(MAKE)
#                     $(build)=scripts/kconfig $@" (scripts/kconfig/Makefile:
#                     "syncconfig: $(obj)/conf")
[COMMON]
use_tristate = no
target_vars = obj- lib-
composite_objects = modules
entry_files = Kbuild Makefile
top_dirs = tools scripts scripts/dtc api?CONFIG_API boot cmd?CONFIG_CMDLINE common dts?CONFIG_OF_EMBED env lib fs net?CONFIG_NET disk drivers drivers/ddr/fsl?CONFIG_SYS_FSL_DDR drivers/ddr/fsl?CONFIG_SYS_FSL_MMDC drivers/ddr/altera?CONFIG_ALTERA_SDRAM drivers/usb/cdns3 drivers/usb/dwc3 drivers/usb/common drivers/usb/emul drivers/usb/eth drivers/usb/gadget?CONFIG_USB_GADGET drivers/usb/gadget/udc?CONFIG_USB_GADGET drivers/usb/host drivers/usb/mtu3 drivers/usb/musb-new drivers/usb/isp1760 drivers/usb/phy drivers/usb/tcpm drivers/usb/ulpi post?CONFIG_POST test?CONFIG_UNIT_TEST board/sandbox arch/sandbox/cpu arch/sandbox/lib
entry_goals = scripts/kconfig/syncconfig
extra_objects = arch/sandbox/cpu/start.o arch/sandbox/cpu/sdl.o?CONFIG_SANDBOX_SDL
ignore_dirs = doc
ignore_files = built-in.o
